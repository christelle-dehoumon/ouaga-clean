<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="/dashboard/shared/logo-final-viela.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Brigade Laabal — VIELA</title>
<link rel="stylesheet" href="/dashboard/shared/design.css">
<link rel="stylesheet" href="/dashboard/shared/shared.css">
<link rel="stylesheet" href="/brigade/brigade.css">
</head>
<body>
<header class="entete">
  <span class="logo" aria-hidden="true"><img src="/dashboard/shared/logo-final-viela.png" alt=""></span>
  <div class="titre">
    <b>Brigade Laabal</b>
    <span id="sous-titre">Cas à vérifier sur place</span>
  </div>
  <a class="lien-citoyen" href="/citizen/">Page citoyen</a>
  <span id="reseau" class="reseau" role="status">…</span>
</header>

<nav class="barre" aria-label="Filtres">
  <span id="nouveaux" class="nouveaux" hidden></span>
  <button id="ouvrir-carte" class="btn-petit btn-carte" type="button">Carte</button>
  <button id="actualiser" class="btn-petit" type="button"><span class="ico i-actualiser" aria-hidden="true"></span>Actualiser</button>
</nav>
<div id="bandeau-sim" class="bandeau-sim" hidden>SIMULATION — DONNÉES FICTIVES ET SCÉNARIOS DE TEST</div>

<main>
  <p id="etat" class="etat" role="status" aria-live="polite">Chargement…</p>
  <section id="attente" class="attente" hidden aria-live="polite"></section>
  <ul id="liste" class="cartes"></ul>
</main>

<section id="panneau-carte" class="panneau-carte" hidden aria-label="Carte des cas à vérifier">
  <header class="panneau-carte-entete">
    <button id="fermer-carte" class="btn-petit" type="button"><span class="ico i-retour" aria-hidden="true"></span>Liste</button>
    <b id="carte-compte">Cas à vérifier</b>
    <span class="legende-cas"><span class="marqueur-cas marqueur-depotoir" aria-hidden="true"></span>Dépotoir
      <span class="marqueur-cas marqueur-nettoyage" aria-hidden="true"></span>Nettoyage</span>
  </header>
  <p id="carte-message" class="carte-message" hidden>Fond de carte indisponible (réseau)</p>
  <div id="brigade-map" class="brigade-map"></div>
</section>

<section id="detail" class="detail" hidden aria-modal="true" role="dialog" aria-labelledby="detail-titre">
  <div class="feuille">
    <header class="detail-entete">
      <button id="retour" class="btn-petit" type="button"><span class="ico i-retour" aria-hidden="true"></span>Retour</button>
      <h2 id="detail-titre">Cas</h2>
    </header>
    <div class="detail-corps">
      <figure class="photo"><img id="detail-photo" alt="Photo floutée du dépotoir"><figcaption id="photo-etat"></figcaption></figure>
      <div id="detail-alertes" class="alertes"></div>
      <dl id="detail-infos" class="infos"></dl>
      <details class="historique"><summary>Historique</summary><ol id="detail-histo"></ol></details>
    </div>
    <footer class="detail-actions">
      <button id="rejeter" class="btn btn-rejeter" type="button"><span class="ico i-croix" aria-hidden="true"></span>Rejeter</button>
      <button id="confirmer" class="btn btn-confirmer" type="button"><span class="ico i-ok" aria-hidden="true"></span>Confirmer</button>
    </footer>
  </div>
</section>
<script type="module" src="/brigade/brigade.js"></script>
</body>
</html>
