<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d1f1e">
<title>Brigade Laabal — Ouaga Clean</title>
<link rel="stylesheet" href="/dashboard/shared/shared.css">
<link rel="stylesheet" href="/brigade/brigade.css">
</head>
<body>
<header class="entete">
  <span class="drapeau" aria-hidden="true"><i></i><i></i><i></i></span>
  <div class="titre">
    <b>Brigade Laabal</b>
    <span id="sous-titre">Cas à vérifier sur place</span>
  </div>
  <span id="reseau" class="reseau" role="status">…</span>
</header>

<nav class="barre" aria-label="Filtres">
  <div class="segments" role="group" aria-label="Données">
    <button type="button" class="seg actif" data-mode="reel" aria-pressed="true">Réel</button>
    <button type="button" class="seg" data-mode="sim" aria-pressed="false">Simulation</button>
  </div>
  <span id="nouveaux" class="nouveaux" hidden></span>
  <button id="actualiser" class="btn-petit" type="button">Actualiser</button>
</nav>
<div id="bandeau-sim" class="bandeau-sim" hidden>SIMULATION — DONNÉES FICTIVES ET SCÉNARIOS DE TEST</div>

<main>
  <p id="etat" class="etat" role="status" aria-live="polite">Chargement…</p>
  <section id="attente" class="attente" hidden aria-live="polite"></section>
  <ul id="liste" class="cartes"></ul>
</main>

<section id="detail" class="detail" hidden aria-modal="true" role="dialog" aria-labelledby="detail-titre">
  <header class="detail-entete">
    <button id="retour" class="btn-petit" type="button">Retour</button>
    <h2 id="detail-titre">Cas</h2>
  </header>
  <div class="detail-corps">
    <figure class="photo"><img id="detail-photo" alt="Photo floutée du dépotoir"><figcaption id="photo-etat"></figcaption></figure>
    <dl id="detail-infos" class="infos"></dl>
    <div id="detail-alertes" class="alertes"></div>
    <details class="historique"><summary>Historique</summary><ol id="detail-histo"></ol></details>
  </div>
  <footer class="detail-actions">
    <button id="rejeter" class="btn btn-rejeter" type="button">Rejeter</button>
    <button id="confirmer" class="btn btn-confirmer" type="button">Confirmer</button>
  </footer>
</section>
<script type="module" src="/brigade/brigade.js"></script>
</body>
</html>
