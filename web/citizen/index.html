<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signaler un dépotoir</title>
<style>
:root{--bg:#f2f4f3;--ink:#12221b;--mute:#5b6b63;--line:#cfd8d3;--green:#1f6b4a;--warn:#b45309;--bad:#b91c1c;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a15;--ink:#e8f0ec;--mute:#9db0a6;--line:#2a3b33;--green:#5fbf93;--warn:#f0a35a;--bad:#f08080;--card:#16241d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:30rem;margin:0 auto;padding:1.25rem 1rem 3rem}
h1{font-size:1.6rem;line-height:1.15;margin:.5rem 0 .25rem}
p.lead{margin:0 0 1.25rem;color:var(--mute)}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1rem;margin-bottom:.9rem}
label,.lbl{display:block;font-weight:600;margin-bottom:.4rem}
button,.btn{font:inherit;min-height:48px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:.6rem 1rem;width:100%}
button.primary{background:var(--green);color:#fff;border-color:var(--green);font-weight:700}
button:disabled{opacity:.5}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.sizes input{position:absolute;opacity:0}
.sizes label{margin:0;text-align:center;border:1px solid var(--line);border-radius:8px;padding:.7rem .2rem;font-weight:500}
.sizes input:checked+label{background:var(--green);color:#fff;border-color:var(--green)}
.sizes input:focus-visible+label{outline:3px solid var(--green);outline-offset:2px}
#preview{display:none;width:100%;max-height:14rem;object-fit:cover;border-radius:8px;margin-top:.6rem}
.small{color:var(--mute);font-size:.9rem;margin:.4rem 0 0}
#result{display:none;border-left:6px solid var(--green)}
#result.a_verifier,#result.attente{border-color:var(--warn)}
#result.rejete{border-color:var(--bad)}
#result b{display:block;font-size:1.15rem}
#queue{display:none}
</style>
</head>
<body>
<main>
  <h1>Signaler un dépotoir</h1>
  <p class="lead">Une photo, votre position, la taille. Le signalement part même sans réseau.</p>

  <section>
    <label for="photo">Photo</label>
    <input id="photo" type="file" accept="image/*" capture="environment">
    <img id="preview" alt="Aperçu de la photo">
  </section>

  <section>
    <span class="lbl">Position</span>
    <button id="gps" type="button">Utiliser ma position</button>
    <p class="small" id="gpsinfo">Position non prise.</p>
  </section>

  <section>
    <span class="lbl">Taille du dépotoir</span>
    <div class="sizes">
      <input type="radio" name="size" id="s1" value="petit"><label for="s1">Petit</label>
      <input type="radio" name="size" id="s2" value="moyen" checked><label for="s2">Moyen</label>
      <input type="radio" name="size" id="s3" value="grand"><label for="s3">Grand</label>
    </div>
  </section>

  <button id="send" class="primary" type="button">Envoyer le signalement</button>

  <section id="result" aria-live="polite"></section>
  <section id="queue" aria-live="polite"><span id="qtxt"></span> <button id="retry" type="button" style="margin-top:.6rem">Renvoyer maintenant</button></section>
</main>

<script>
const $ = id => document.getElementById(id);
const API = "/api/reports";
const QKEY = "ouaga_queue_v1";
let pos = null, photo = null;

const getQ = () => { try { return JSON.parse(localStorage.getItem(QKEY) || "[]"); } catch { return []; } };
const setQ = q => { try { localStorage.setItem(QKEY, JSON.stringify(q)); } catch {} showQ(); };
function showQ(){ const n = getQ().length; $("queue").style.display = n ? "block" : "none";
  $("qtxt").textContent = n + (n > 1 ? " signalements en attente d'envoi." : " signalement en attente d'envoi."); }

function resize(file, max = 1024){
  return new Promise((ok, ko) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); ok(c.toDataURL("image/jpeg", 0.7));
    };
    img.onerror = () => { URL.revokeObjectURL(url); ko(new Error("photo")); };
    img.src = url;
  });
}

$("photo").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  try { photo = await resize(f); $("preview").src = photo; $("preview").style.display = "block"; }
  catch { photo = null; $("preview").style.display = "none"; show("rejete", "Photo illisible", "Reprenez la photo."); }
});

$("gps").addEventListener("click", () => {
  if (!navigator.geolocation) { $("gpsinfo").textContent = "Position indisponible sur cet appareil."; return; }
  $("gpsinfo").textContent = "Recherche de la position…";
  navigator.geolocation.getCurrentPosition(
    p => { pos = {lat: p.coords.latitude, lon: p.coords.longitude, accuracy_m: p.coords.accuracy};
           $("gpsinfo").textContent = "Position prise, précision environ " + Math.round(p.coords.accuracy) + " m."; },
    err => { $("gpsinfo").textContent = err.code === 1
      ? "Position refusée. Autorisez la localisation (la page doit être en https)." : "Position introuvable. Réessayez dehors."; },
    {enableHighAccuracy: true, timeout: 15000, maximumAge: 10000});
});

function show(cls, title, msg){
  const r = $("result"); r.className = cls; r.style.display = "block";
  r.innerHTML = ""; const b = document.createElement("b"); b.textContent = title;
  r.append(b, document.createTextNode(msg || ""));
}
const TITLES = {accepte: "Signalement accepté", rejete: "Signalement refusé", a_verifier: "Signalement à vérifier"};

async function post(item){
  const r = await fetch(API, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(item)});
  if (!r.ok) throw new Error("http " + r.status);
  return r.json();
}

async function flush(){
  const q = getQ(); if (!q.length || !navigator.onLine) return;
  const rest = [];
  for (const it of q){ try { await post(it); } catch { rest.push(it); } }
  setQ(rest);
}

$("send").addEventListener("click", async () => {
  if (!pos) { show("rejete", "Position manquante", "Touchez « Utiliser ma position »."); return; }
  const item = {
    id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)).slice(0, 36),
    lat: pos.lat, lon: pos.lon, accuracy_m: pos.accuracy_m,
    size: document.querySelector("input[name=size]:checked").value,
    reported_at: new Date().toISOString(), photo_b64: photo, source: "reel"
  };
  $("send").disabled = true;
  try {
    const res = await post(item);
    show(res.status, TITLES[res.status] || "Réponse reçue", res.reason);
    if (res.status !== "rejete") { photo = null; $("photo").value = ""; $("preview").style.display = "none"; }
  } catch {
    setQ(getQ().concat(item));
    show("attente", "Pas de réseau", "Le signalement est gardé sur le téléphone et partira dès le retour du réseau.");
  }
  $("send").disabled = false;
});

$("retry").addEventListener("click", flush);
window.addEventListener("online", flush);
showQ(); flush();
</script>
</body>
</html>
